name: Build Aurum Ledger APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Project Files
        run: |
          # Back up your custom pubspec.yaml and lib/main.dart
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak

          # Generate missing android/ platform folders automatically
          flutter create --org com.aurum.ledger --project-name aurum_ledger .

          # Restore your custom files
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Inject M-Pesa SMS & Truecaller Overlay Permissions into AndroidManifest.xml
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aurum.ledger">

              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Aurum Ledger"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Truecaller-Style Floating Window Service -->
                  <service
                      android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="accountability_overlay_service"/>
                  </service>

                  <!-- M-Pesa Background SMS Receiver -->
                  <receiver
                      android:name="com.shounakmulay.telephony.sms.IncomingSmsReceiver"
                      android:permission="android.permission.BROADCAST_SMS"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Enforce Android minSdkVersion 23 & Compile SDK 34
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Compiled Aurum APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurum-Ledger-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
