name: Build Aurum Ledger APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Pinned Stable 3.24.5 for Reliable Plugin Compatibility)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Project Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak

          flutter create --org com.aurum.ledger --project-name aurum_ledger .

          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Inject M-Pesa SMS & Truecaller Overlay Permissions into AndroidManifest.xml
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Aurum Ledger"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Truecaller-Style Floating Window Service -->
                  <service
                      android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="accountability_overlay_service"/>
                  </service>

                  <!-- M-Pesa Background SMS Receiver -->
                  <receiver
                      android:name="com.shounakmulay.telephony.sms.IncomingSmsReceiver"
                      android:permission="android.permission.BROADCAST_SMS"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Patch Plugin Namespaces & Enforce SDK 34 / minSdk 23
        run: |
          # 1. Patch cached plugins (another_telephony & flutter_overlay_window) directly in PUB_CACHE
          for build_file in $(find "$PUB_CACHE" -name "build.gradle"); do
            dir_path=$(dirname "$build_file")
            manifest_file="$dir_path/src/main/AndroidManifest.xml"
            if [ -f "$manifest_file" ]; then
              pkg=$(grep -oP 'package="\K[^"]+' "$manifest_file" || true)
              if [ -n "$pkg" ] && ! grep -q "namespace" "$build_file"; then
                echo "Injecting namespace '$pkg' into$build_file"
                sed -i "s/android {/android {\n    namespace '$pkg'/g" "$build_file"
              fi
              # Strip deprecated package attribute from plugin AndroidManifest.xml for AGP 8+
              sed -i 's/package="[^"]*"//g' "$manifest_file"
            fi
          done

          # 2. Enforce minSdkVersion 23 and compileSdkVersion 34 in app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle
          fi

          # 3. Align Kotlin & Java JVM targets across all subprojects in root android/build.gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      
